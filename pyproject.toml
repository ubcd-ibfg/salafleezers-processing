[project]
name = "salafleezers-processing"
version = "0.1.0"
description = "Python port of the SalaFleezer optical tweezers data processing pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "h5py>=3.11",
    "matplotlib>=3.9",
    "click>=8.1",
]

[project.scripts]
sfz = "salafleezers.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salafleezers"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
