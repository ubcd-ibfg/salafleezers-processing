<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive viewer and analysis GUI for SalaFleezer optical-tweezers traces." />
    <meta name="theme-color" content="#7c3aed" />
    <title>SalaFleezer</title>
    <script>
      // Stamp the theme before first paint so there is no flash of the wrong
      // theme -- app.css keys every color token off data-theme, so this has
      // to run before any element renders, not in onMount. This is the only
      // source of truth for the "no saved preference" default; theme.svelte.ts
      // reads the same two inputs (localStorage, then matchMedia) and stays
      // in sync with whatever this script decided.
      (function () {
        var saved = localStorage.getItem('sfz.theme')
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
